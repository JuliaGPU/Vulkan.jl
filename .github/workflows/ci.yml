# Copied from VulkanCore.jl
# Based on https://github.com/vsg-dev/VulkanSceneGraph/blob/master/.github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

env:
  JULIA_GITHUB_ACTIONS_CI: ON

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1.10', '1', 'pre', 'nightly']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      - name: Test generator
        if: matrix.julia-version == '1'
        run: julia --project=generator -e 'using Pkg; Pkg.test()'
